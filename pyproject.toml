[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-dgen-telemetry"
version = "0.2.0"
description = "Live terminal telemetry viewer for tt-d-gen deployments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "rich>=13.7",
]

[project.scripts]
tt-dgen-telemetry = "telemetry_tui.__main__:main"

[tool.setuptools]
packages = ["telemetry_tui"]
package-dir = { telemetry_tui = "." }
